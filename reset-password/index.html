<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Sales Research Pro</title><link rel="stylesheet" href="../assets/site.css"></head><body><main class="site-shell"><section class="form-card"><div class="brand" style="justify-content:center;margin-bottom:26px"><span class="logo">SR</span><span>Sales Research Pro</span></div><h1>Reset your password</h1><p class="sub">Choose a new password for your account.</p><div id="form"><div class="field"><label for="pw">New password</label><input id="pw" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label for="pw2">Confirm new password</label><input id="pw2" type="password" minlength="6" autocomplete="new-password"></div><button class="primary-btn" id="save">UPDATE PASSWORD</button></div><div id="msg" class="msg">Checking your recovery link…</div></section></main><script>
const SUPABASE_URL='https://cornnadejzvqkidrriqb.supabase.co';
const SUPABASE_KEY=['sb','publishable','9h7qxQUlXS8oDhoiFjzu8A','pLZgb-1v'].join('_');

function show(t,kind=''){msg.textContent=t;msg.className='msg'+(kind?' '+kind:'')}
